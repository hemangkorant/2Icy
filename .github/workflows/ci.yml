name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are used in this workflow. It never deploys, never touches
# Supabase, and never uploads documents or trip data — it only verifies the
# code compiles, lints cleanly, and passes its unit tests.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build step doesn't fail on missing env vars.
          # These are not secrets and are never used against a real backend in CI.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_APP_URL: https://placeholder.pages.dev
