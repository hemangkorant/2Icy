project_id = "iceland-trip-tracker"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local dev only. In production this is your real deployed app URL
# (VITE_APP_URL) configured in the Supabase Dashboard, not here.
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
# Magic link only: no password auth in this app.
double_confirm_changes = false

[storage]
enabled = true
file_size_limit = "25MiB"

[realtime]
enabled = true
